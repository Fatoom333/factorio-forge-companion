cmd-clean=Удалить служебную поверхность, если она осталась после прогона.
circuit-cost=Forge: __1__ тактов — это __2__ секунд игрового времени на твоей базе, а при скорости __3__ они пройдут без возможности вмешаться.
circuit-confirm=Forge: пишу автосейв с именем _autosave-forge, он не затирает ни твоих сохранений, ни нумерованных автосейвов игры. Пока ничего не запущено; чтобы начать, повтори ту же команду.
clean-speed=Forge: скорость игры, поднятая прогоном схемы, возвращена на место.
