[forge]
written=Forge: записано в __1__
region-empty=Forge: в этой области нечего помещать в чертёж.
region-written=Forge: __1__ объектов выгружено в __2__
not-a-blueprint=Forge: эта строка не является чертежом.
verified=Forge: размещено __1__ объектов из __2__.
circuit-started=Forge: прогон __1__ объектов на __2__ тактов. Игра будет ускорена до конца прогона.
circuit-done=Forge: записано __1__ тактов в __2__
circuit-nothing-built=Forge: ничего не построилось, записывать нечего.

region-usage=Использование: /forge-region <x1> <y1> <x2> <y2> [имя]
verify-usage=Использование: /forge-verify <строка чертежа>
