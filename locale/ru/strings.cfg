window-nothing-held-detail=В руке ничего — игра сообщает __1__.

[mod-setting-name]
forge-circuit-speed=Скорость прогона схемы

[mod-setting-description]
forge-circuit-speed=Насколько ускоряется игра, пока /forge-circuit ведёт запись. Игрового времени прогон стоит одинаково при любой скорости — она решает лишь, успеешь ли ты в нём что-то заметить. На живой базе меньшее значение оставляет возможность среагировать.

[item-name]
forge-region-selector=Выделитель области Forge

[item-description]
forge-region-selector=Протяни прямоугольник, и он будет выгружен строкой чертежа в script-output/factorio-forge/blueprints. С Alt плитки не берутся.

[shortcut-name]
forge-give-region-selector=Выделитель области Forge
