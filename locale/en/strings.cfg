[forge]
written=Forge: written __1__
region-empty=Forge: nothing in that area to put in a blueprint.
region-written=Forge: __1__ entities exported to __2__
not-a-blueprint=Forge: that string is not a blueprint.
verified=Forge: __1__ of __2__ entities placed.
circuit-started=Forge: running __1__ entities for __2__ ticks. The game will speed up until it finishes.
circuit-done=Forge: recorded __1__ ticks to __2__
circuit-nothing-built=Forge: nothing was built, so there is nothing to record.
cleaned=Forge: the scratch surface has been deleted.
clean-absent=Forge: there is no scratch surface, so there is nothing to delete.
clean-occupied=Forge: you are standing on the scratch surface. Leave it first.

region-usage=Usage: /forge-region <x1> <y1> <x2> <y2> [name]
verify-usage=Usage: /forge-verify <blueprint string>
circuit-usage=Usage: /forge-circuit <ticks> <blueprint string>

cmd-export=Export the mod set, startup settings and research state of this save.
cmd-region=Export a rectangle of the map as a blueprint string.
cmd-verify=Paste a blueprint on a scratch surface and report what actually placed.
cmd-circuit=Build a circuit and record every network, tick by tick.
cmd-clean=Delete the scratch surface, in case a run left one behind.
circuit-cost=Forge: __1__ ticks is __2__ seconds of game time on this base, and at speed __3__ they pass with no chance to step in.
circuit-confirm=Forge: nothing has started. Save the game first if that matters, then run the same command again to go ahead.

[mod-setting-name]
forge-circuit-speed=Circuit run speed

[mod-setting-description]
forge-circuit-speed=How fast the game runs while /forge-circuit records. The game time a run costs is the same either way -- speed decides how much of it you get to watch. On a live base, a lower value leaves you able to react.
